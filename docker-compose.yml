# Servicios locales para desarrollo: PostgreSQL y Redis.
# Uso: pnpm db:up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booklet
      POSTGRES_PASSWORD: booklet
      POSTGRES_DB: booklet
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U booklet']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
